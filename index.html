<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>總務行政戰情助理</title>
<style>
  :root {
    --bg: #f1f5f9;
    --surface: #ffffff;
    --surface-alt: #f8fafc;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
    --primary: #1d4ed8;
    --primary-soft: #dbeafe;
    --red: #dc2626;
    --red-soft: #fee2e2;
    --amber: #d97706;
    --amber-soft: #fef3c7;
    --green: #059669;
    --green-soft: #d1fae5;
    --blue-soft: #e0f2fe;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(15, 23, 42, .08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input, select, textarea { font-family: inherit; font-size: 13px; }
  button {
    cursor: pointer; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); border-radius: 6px; padding: 6px 11px; font-weight: 600;
    transition: .15s;
  }
  button:hover { background: var(--surface-alt); border-color: #cbd5e1; }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: #1e40af; }
  .btn-danger { background: var(--red-soft); color: var(--red); border-color: #fecaca; }
  .btn-danger:hover { background: #fecaca; }
  .btn-success { background: var(--green); color: #fff; border-color: var(--green); }
  .btn-success:hover { background: #047857; }
  .btn-sm { padding: 3px 8px; font-size: 12px; }
  .btn-xs { padding: 2px 6px; font-size: 11px; }

  /* 頂部列與導覽 */
  .topbar {
    background: #0f172a; color: #f8fafc; padding: 10px 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; }
  .brand small { font-size: 12px; font-weight: 400; color: #94a3b8; }
  .top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sync-pill {
    font-size: 12px; padding: 3px 9px; border-radius: 999px;
    background: #1e293b; color: #cbd5e1; display: inline-flex; align-items: center; gap: 6px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #94a3b8; }
  .dot.ok { background: #10b981; }
  .dot.syncing { background: #f59e0b; animation: pulse 1s infinite; }
  .dot.err { background: #ef4444; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  .portal-bar {
    background: #1e293b; padding: 6px 18px; display: flex; align-items: center;
    gap: 8px; overflow-x: auto; border-bottom: 1px solid #334155;
  }
  .portal-chip {
    background: #334155; color: #f1f5f9; padding: 4px 10px; border-radius: 999px;
    font-size: 12px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px;
  }
  .portal-chip:hover { background: #475569; text-decoration: none; }

  .nav-tabs {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 18px; display: flex; gap: 4px; overflow-x: auto;
  }
  .nav-tab {
    padding: 10px 14px; border: none; background: transparent; border-radius: 0;
    border-bottom: 3px solid transparent; color: var(--muted); font-weight: 600; white-space: nowrap;
  }
  .nav-tab:hover { color: var(--text); background: var(--surface-alt); }
  .nav-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .badge-soon {
    font-size: 10px; background: #e2e8f0; color: #475569; padding: 1px 5px;
    border-radius: 4px; margin-left: 4px; font-weight: 500;
  }

  .container { max-width: 1520px; margin: 0 auto; padding: 14px 18px 40px; }

  /* KPI 列與一屏三欄戰情室 */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  .kpi-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 15px; display: flex; justify-content: space-between; align-items: center;
    box-shadow: var(--shadow); cursor: pointer;
  }
  .kpi-card:hover { border-color: #94a3b8; }
  .kpi-label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .kpi-val { font-size: 26px; font-weight: 800; line-height: 1.2; margin-top: 2px; }
  .kpi-red .kpi-val { color: var(--red); }
  .kpi-amber .kpi-val { color: var(--amber); }
  .kpi-blue .kpi-val { color: var(--primary); }
  .kpi-green .kpi-val { color: var(--green); }

  .dash-grid { display: grid; grid-template-columns: 1.35fr 1.05fr 0.95fr; gap: 14px; align-items: start; }
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden; margin-bottom: 14px;
  }
  .panel-hd {
    padding: 10px 14px; background: var(--surface-alt); border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .panel-hd h3 { margin: 0; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .panel-bd { padding: 12px 14px; }
  .scroll-list { max-height: 360px; overflow-y: auto; }

  /* 標籤與清單項 */
  .tag {
    display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 11px; font-weight: 700;
    white-space: nowrap;
  }
  .tag-red { background: var(--red-soft); color: var(--red); }
  .tag-amber { background: var(--amber-soft); color: #b45309; }
  .tag-green { background: var(--green-soft); color: #047857; }
  .tag-blue { background: var(--primary-soft); color: var(--primary); }
  .tag-gray { background: #e2e8f0; color: #334155; }

  .alert-item, .routine-item, .memo-item {
    padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 8px; background: #fff;
  }
  .alert-item.red { border-left: 4px solid var(--red); background: #fffafa; }
  .alert-item.amber { border-left: 4px solid var(--amber); background: #fffdf5; }
  .alert-item.blue { border-left: 4px solid var(--primary); }
  .alert-item:hover { border-color: #94a3b8; }
  .item-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .item-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }

  .mini-bar-wrap { background: #e2e8f0; height: 7px; border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .mini-bar { height: 100%; background: var(--primary); border-radius: 99px; }

  /* Memo 快填區 */
  .memo-quick {
    display: flex; flex-direction: column; gap: 6px; padding-bottom: 10px;
    border-bottom: 1px dashed var(--border); margin-bottom: 10px;
  }
  .memo-quick-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .memo-quick input[type="text"] {
    width: 100%; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 6px;
  }
  .memo-item.urgent { border-left: 4px solid var(--red); background: #fffafa; }
  .memo-item.due-hit { border-left: 4px solid var(--amber); background: #fffbeb; }
  .memo-item.done { opacity: .6; text-decoration: line-through; background: var(--surface-alt); }

  /* 表格與表單 */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
  th { background: var(--surface-alt); font-weight: 700; color: #334155; white-space: nowrap; }
  tr:hover td { background: #f8fafc; }

  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 14px; }
  .form-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 12px; font-weight: 700; color: #334155; }
  .field input, .field select, .field textarea {
    padding: 7px 9px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff;
  }
  .field textarea { min-height: 68px; resize: vertical; }
  .check-group { display: flex; gap: 14px; flex-wrap: wrap; padding: 6px 0; }
  .check-group label { display: inline-flex; align-items: center; gap: 5px; font-weight: 500; cursor: pointer; }

  /* 標案詳情與階段檢核 */
  .stage-card {
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; background: #fff;
  }
  .stage-hd {
    padding: 10px 14px; background: var(--surface-alt); border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .chk-row {
    display: grid; grid-template-columns: 24px 1fr 165px 125px 28px;
    gap: 8px; align-items: center; padding: 7px 14px; border-bottom: 1px solid #f1f5f9;
  }
  .chk-row:last-child { border-bottom: none; }
  .chk-row input[type="text"], .chk-row input[type="date"] {
    padding: 4px 6px; border: 1px solid #e2e8f0; border-radius: 4px; font-size: 12px; width: 100%;
  }
  .req-star { color: var(--red); font-weight: 800; margin-right: 3px; }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(15, 23, 42, .55);
    display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #fff; border-radius: 12px; width: 100%; max-width: 760px; max-height: 90vh;
    display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }
  .modal-hd {
    padding: 13px 18px; border-bottom: 1px solid var(--border); background: var(--surface-alt);
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-hd h3 { margin: 0; font-size: 16px; }
  .modal-bd { padding: 16px 18px; overflow-y: auto; }
  .modal-ft {
    padding: 11px 18px; border-top: 1px solid var(--border); background: var(--surface-alt);
    display: flex; justify-content: flex-end; gap: 8px;
  }

  /* Toast */
  #toast {
    position: fixed; bottom: 20px; right: 20px; background: #0f172a; color: #fff;
    padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
    box-shadow: 0 6px 20px rgba(0,0,0,.2); opacity: 0; pointer-events: none;
    transition: .25s; z-index: 2000;
  }
  #toast.show { opacity: 1; }

  /* 甘特圖容器 */
  .gantt-box { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: #fff; padding: 8px; }
  .empty-state { text-align: center; padding: 28px 14px; color: var(--muted); font-size: 13px; }
  .lessons-box {
    background: #fffbeb; border: 1px solid #fcd34d; border-radius: 8px;
    padding: 10px 12px; margin-bottom: 12px; font-size: 13px; white-space: pre-line;
  }

  /* 專屬列印區（螢幕隱藏、列印顯示） */
  #print-area { display: none; }

  @media (max-width: 1150px) {
    .dash-grid { grid-template-columns: 1fr; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .chk-row { grid-template-columns: 24px 1fr; }
  }

  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    body { background: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #app-shell, .modal-backdrop, #toast { display: none !important; }
    #print-area { display: block !important; width: 100%; color: #0f172a; }
    .print-header {
      display: flex; justify-content: space-between; align-items: flex-end;
      border-bottom: 2px solid #0f172a; padding-bottom: 6px; margin-bottom: 10px;
    }
    .print-meta {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
      background: #f8fafc; border: 1px solid #cbd5e1; padding: 7px 10px;
      border-radius: 6px; font-size: 11.5px; margin-bottom: 10px;
    }
    .print-footer {
      display: grid; grid-template-columns: 1.2fr 1.4fr 1fr; gap: 10px;
      margin-top: 10px; font-size: 11.5px; page-break-inside: avoid;
    }
    .print-box { border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px 10px; }
    .sign-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; height: 54px; text-align: center; }
    .sign-cell { border: 1px solid #cbd5e1; display: flex; flex-direction: column; justify-content: space-between; padding: 3px; font-size: 11px; }
  }
</style>
</head>
<body>

<div id="app-shell">
  <!-- 頂部列 -->
  <div class="topbar">
    <div class="brand">
      <span>🏫 <span id="school-title">高雄市立溪埔國民中學</span> 總務行政戰情助理</span>
      <small id="today-roc"></small>
    </div>
    <div class="top-actions">
      <span class="sync-pill" id="sync-status" title="點擊強制重新同步" style="cursor:pointer" onclick="syncFromCloud(true)">
        <span class="dot" id="sync-dot"></span>
        <span id="sync-text">載入中...</span>
      </span>
      <input id="global-search" type="search" placeholder="🔍 搜尋標案／Memo／例行項..." style="padding:5px 10px;border-radius:6px;border:1px solid #334155;background:#1e293b;color:#fff;width:210px;" oninput="renderCurrentView()">
      <button class="btn-primary" onclick="openProjectWizard()">＋ 開新標案</button>
      <button style="background:#334155;color:#fff;border-color:#475569" onclick="openSettingsModal()">⚙️ 連線與備份</button>
    </div>
  </div>

  <!-- 常用公務傳送門 -->
  <div class="portal-bar" id="portal-bar"></div>

  <!-- 主頁籤導覽 -->
  <div class="nav-tabs" id="nav-tabs">
    <button class="nav-tab active" data-tab="dashboard" onclick="switchTab('dashboard')">📊 起始戰情室</button>
    <button class="nav-tab" data-tab="projects" onclick="switchTab('projects')">📋 招標與工程控管</button>
    <button class="nav-tab" data-tab="annual-gantt" onclick="switchTab('annual-gantt')">📅 全校年度甘特圖</button>
    <button class="nav-tab" data-tab="templates" onclick="switchTab('templates')">🗂️ 年度標案模板庫</button>
    <button class="nav-tab" data-tab="routines" onclick="switchTab('routines')">🔁 年度固定例行事務</button>
    <button class="nav-tab" data-tab="upcoming" onclick="switchTab('upcoming')">🔧 工程品管／太陽能／水電 <span class="badge-soon">下階段</span></button>
  </div>

  <!-- 主內容容器 -->
  <div class="container" id="main-view"></div>
</div>

<!-- 專屬列印 PDF 容器 -->
<div id="print-area"></div>

<!-- 通用彈窗 -->
<div class="modal-backdrop" id="modal-backdrop" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <div class="modal-hd">
      <h3 id="modal-title">視窗</h3>
      <button class="btn-sm" onclick="closeModal()">✕ 關閉</button>
    </div>
    <div class="modal-bd" id="modal-body"></div>
    <div class="modal-ft" id="modal-footer"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ============================================================================
// 1. 狀態儲存與本機快取（0.1 秒秒開引擎 — 預設常數置頂避免初始化錯誤）
// ============================================================================
const STORAGE_CFG = 'ga_assistant_cfg_v1';
const STORAGE_DATA = 'ga_assistant_cache_v1';

const DEFAULT_PORTALS = [
  { name: '政府電子採購網', url: 'https://web.pcc.gov.tw/', icon: '🏛️' },
  { name: '機關綠色採購網', url: 'https://greenliving.moenv.gov.tw/', icon: '🌿' },
  { name: '優先採購平台', url: 'https://ptp.sfaa.gov.tw/', icon: '🤝' },
  { name: '節約用水填報網', url: 'https://www.wcis.org.tw/', icon: '💧' },
  { name: '台灣電力電子帳單', url: 'https://ebpps2.taipower.com.tw/', icon: '⚡' }
];

let appConfig = loadConfig();
let appData = loadCache();
let currentTab = 'dashboard';
let selectedProjectId = null;
let selectedProjectSubtab = 'checklist'; // checklist | gantt
let showDoneMemos = false;
let annualGanttYear = new Date().getFullYear() - 1911;

function loadConfig() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_CFG)) || { gasUrl: '', token: '', schoolName: '高雄市立溪埔國民中學' };
  } catch { return { gasUrl: '', token: '', schoolName: '高雄市立溪埔國民中學' }; }
}

function saveConfig(cfg) {
  appConfig = { ...appConfig, ...cfg };
  localStorage.setItem(STORAGE_CFG, JSON.stringify(appConfig));
}

function emptyData() {
  return {
    schoolName: (appConfig && appConfig.schoolName) || '高雄市立溪埔國民中學',
    serverTime: '',
    portals: DEFAULT_PORTALS.slice(),
    tables: {
      Projects: [], Project_Tasks: [], Templates: [],
      Project_Materials: [], Project_ChangeOrders: [], Project_Billings: [], Project_Responsibilities: [],
      Solar_Contracts: [], Solar_Records: [], Utilities_Meters: [], Utilities_Bills: [],
      Annual_Routines: [], Quick_Memos: []
    }
  };
}

function loadCache() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_DATA));
    if (raw && raw.tables) {
      return { ...emptyData(), ...raw, tables: { ...emptyData().tables, ...raw.tables } };
    }
  } catch {}
  return createDemoSeed();
}

function persistCache() {
  localStorage.setItem(STORAGE_DATA, JSON.stringify(appData));
}

// 尚未綁定 GAS 時提供體驗範本資料，綁定後會自動以雲端資料覆蓋
function createDemoSeed() {
  const d = emptyData();
  const today = todayStr();
  d.tables.Templates = [
    {
      template_id: 'TPL-001', template_name: '年度校園保全警衛勞務採購案',
      procurement_type: '勞務', threshold_tier: '未達(15-150萬)', award_method: '取最有利標精神',
      anchor_label: '新契約生效日',
      stages_offset_json: JSON.stringify([
        { order: 1, name: '招標文件準備與簽核', offset_start: -60, offset_end: -45, checklist: [
          { id: 'c1', text: '備妥投標須知、契約草案、保全人力勤務規範與評審須知', required: true },
          { id: 'c2', text: '簽准未滿3家當場改採限制性招標及監辦方式', required: true }
        ]},
        { order: 2, name: '上網公告與等標', offset_start: -44, offset_end: -34, checklist: [
          { id: 'c3', text: '政府電子採購網公告（等標期不少於5天）', required: true },
          { id: 'c4', text: '開標前陳請校長密封核定底價（系統不存金額）', required: true }
        ]},
        { order: 3, name: '開標、評審與決標', offset_start: -33, offset_end: -20, checklist: [
          { id: 'c5', text: '召開評審小組會議、辦理議價並決標', required: true },
          { id: 'c6', text: '辦理決標公告或定期彙送', required: true }
        ]},
        { order: 4, name: '訂約與履約準備', offset_start: -19, offset_end: -1, checklist: [
          { id: 'c7', text: '完成契約用印與派駐人員良民證查核', required: true }
        ]}
      ]),
      default_materials_json: '[]',
      lessons_learned: '1. 招標規範務必寫明國定假日、選舉日或颱風停班停課輪值計費方式。\n2. 派駐人員更換前須先提報良民證審查。'
    }
  ];
  d.tables.Annual_Routines = [
    {
      routine_id: 'RTN-001', title: '機關綠色採購網路申報檢核', category: '法定填報',
      recurrence_type: '每季', due_rule: 'Q-END-25', lead_days: 20,
      portal_url: 'https://greenliving.moenv.gov.tw/', linked_template_id: '',
      last_done_cycle: '', last_done_date: '', note: '彙整本季具環保與綠建材標章品項申報', is_active: true
    },
    {
      routine_id: 'RTN-002', title: '年底資本門預算保留與補助款結報檢核', category: '預算核銷',
      recurrence_type: '每年', due_rule: '12-10', lead_days: 35,
      portal_url: '', linked_template_id: '',
      last_done_cycle: '', last_done_date: '', note: '確認跨年度工程與補助款進度，提前送主計辦理保留', is_active: true
    },
    {
      routine_id: 'RTN-003', title: '下年度校園保全警衛招標啟動', category: '例行招標預告',
      recurrence_type: '每年', due_rule: '11-28', lead_days: 30,
      portal_url: 'https://web.pcc.gov.tw/', linked_template_id: 'TPL-001',
      last_done_cycle: '', last_done_date: '', note: '可直接點「套模板開案」自動排程', is_active: true
    }

      source_tag: '系統提示', priority: '重要', remind_date: today, due_date: '', is_done: false, done_date: '', converted_ref: ''
    }
  ];
  return d;
}

// ============================================================================
// 2. 台灣政府採購法三級距 ＋ 外掛積木組裝引擎（從「招標文件準備」起跑）
// ============================================================================
function buildStandardStages(opts) {
  const { tier, type, awardMethod, flags, startDate, endDate, engCat } = opts;
  const f = flags || {};
  const stages = [];

  if (tier === '小額(15萬以下)') {
    stages.push(
      { name: '招標／請購文件準備與動支', items: [
        { text: '確認未意圖規避採購法而分批辦理（採購法第14條）', required: true },
        { text: '查詢共同供應契約有無適用品項（或敘明不適用理由）', required: true },
        { text: '備妥規格需求說明並完成請購／經費動支簽核', required: true }
      ]},
      { name: '洽商詢價與下訂', items: [
        { text: '取具合法廠商估價單（核對統編、規格、含稅總價）', required: true },
        { text: '確認交貨／施作期限與保固條件後正式下訂', required: true }
      ]},
      { name: '履約交貨與施作', items: [
        { text: '現場清點數量與規格相符（修繕留存施工前中後照片）', required: true },
        { text: '核對發票／收據抬頭、日期與金額無誤', required: true }
      ]},
      { name: '驗收與核銷結案', items: [
        { text: '由非採購承辦人辦理書面或實地驗收簽章', required: true },
        { text: '完成黏貼憑證送主計審核、出納撥款並歸檔', required: true }
      ]}
    );
  } else if (tier === '未達(15-150萬)') {
    stages.push(
      { name: '招標文件準備與簽核', items: [
        { text: '備妥投標須知、契約草案與規格／預算書圖並簽奉核定', required: true },
        { text: '【關鍵防呆】一併簽准第1次公告未滿3家當場改採限制性招標', required: true },
        { text: '簽核開標與驗收之監辦方式（實地／書面／不派員）', required: true }
      ]},
      { name: '上網公告與等標', items: [
        { text: '政府電子採購網刊登公告（等標期原則不少於5天）', required: true },
        { text: '追蹤廠商疑義與更正公告', required: false },
        { text: '開標前陳請校長密封核定底價（系統嚴禁記錄底價金額）', required: true }
      ]},
      { name: '開標、審標與決標', items: [
        { text: '查驗投標家數（未滿3家依簽准轉限制性招標比議價）', required: true },
        { text: '完成資格規格審查、拆封底價、比減／議價並宣布決標', required: true },
        { text: '完成開／決標紀錄簽認並辦理決標公告或定期彙送', required: true }
      ]},
      { name: '訂約與履約準備', items: [
        { text: '查驗履約保證金繳納（契約免收者註記免附）', required: true },
        { text: '完成契約正副本用印與騎縫章核對', required: true }
      ]},
      { name: '履約執行控管', items: [
        { text: '依契約節點督導履約進度並留存會議或查核紀錄', required: true }
      ]},
      { name: '驗收、核銷與保固', items: [
        { text: '收受竣工／履約完成書面通知並確認是否逾期', required: true },
        { text: '簽派主驗人（承辦人不得兼任）並通知監驗單位', required: true },
        { text: '製作驗收紀錄、收繳保固金、退還履保金並完成核銷歸檔', required: true }
      ]}
    );
  } else {
    stages.push(
      { name: '招標文件準備與前置核准', items: [
        { text: '核定預算書圖、投標須知與契約草案（確認無不當限制競爭）', required: true },
        { text: '確認預算科目、核銷期程並簽准招標方式與決標原則', required: true }
      ]},
      { name: '上網公告與監辦籌備', items: [
        { text: '政府電子採購網公開招標公告（等標期14天以上；第2次起7天）', required: true },
        { text: '書面通知主（會）計及有關單位屆時派員實地監辦', required: true },
        { text: '開標前陳請校長密封核定底價（系統嚴禁記錄底價金額）', required: true }
      ]},
      { name: '開標、審標與決標公告', items: [
        { text: '第1次開標檢核滿3家合格廠商（不足須流標重招）', required: true },
        { text: '確認監辦到場簽認、完成審標與決標紀錄', required: true },
        { text: '【法定死線】自決標日起30日內刊登政府電子採購網決標公告', required: true }
      ]},
      { name: '訂約與開工／履約啟動', items: [
        { text: '收繳履約保證金、查驗保險單據並完成契約正副本用印', required: true },
        { text: '完成開工／履約啟動申報與備查', required: true }
      ]},
      { name: '施工／履約控管', items: [
        { text: '追蹤定期協調會議、日誌報表與契約進度管制', required: true }
      ]},
      { name: '初驗、正式驗收與結算', items: [
        { text: '收受書面竣工報告 → 7日內會同確認竣工並作成紀錄', required: true },
        { text: '確認竣工後30日內辦理初驗／驗收（簽派非承辦人為主驗人）', required: true },
        { text: '驗收完畢後15日內填具「結算驗收證明書」', required: true }
      ]},
      { name: '核銷歸檔與保固移交', items: [
        { text: '退還履保金、收繳保固金、完成主計核銷與歸檔', required: true },
        { text: '轉入「保固追蹤中」，建立保固到期前30天會勘提醒', required: true }
      ]}
    );
  }

  // 外掛注入：採購性質
  const lastIdx = stages.length - 1;
  const execIdx = Math.max(0, stages.length - 2);
  if (type === '工程') {
    stages[0].items.push({ text: `【工程權責】納入附表二權責分工表（${engCat || '一般公共工程'}）並訂定四方完成期限與罰則`, required: true });
    if (stages.length >= 5) {
      stages[3].items.push({ text: '【工程開工前】檢核空污費、營造綜合險（監造核定/業主備查）及施工/品質/安衛/監造計畫核定', required: true });
      stages[4].items.push({ text: '【工程施工中】管制材料資料/同等品/樣品送審、施工日誌、監造報表、變更設計與估驗計價', required: true });
    }
    stages[lastIdx].items.push({ text: '【工程結算】核對竣工圖說、結算明細表、試驗報告、保固切結書與點交紀錄齊全', required: true });
  } else if (type === '勞務') {
    stages[execIdx].items.push({ text: '【校園勞務】查核派駐人員名冊與警察刑事紀錄證明（良民證）', required: true });
    stages[execIdx].items.push({ text: '【校園勞務】按期核對員工勞健保與勞退提繳證明及履約品質紀錄', required: true });
  } else if (type === '財物') {
    stages[lastIdx].items.push({ text: '【財物登帳】完成功能測試、財產／非消耗品增加單登帳、黏貼標籤與原廠保固建檔', required: true });
  }

  // 外掛注入：條件開關
  if (f.use_committee || awardMethod === '最有利標' || awardMethod === '評分及格最低標' || awardMethod === '取最有利標精神') {
    if (tier === '公開(150萬以上)' && awardMethod === '最有利標') {
      stages[0].items.push({ text: '【最有利標】事前報請上級機關核准函文', required: true });
    }
    if (stages[1]) {
      stages[1].items.push({ text: '【評選/評審】簽核成立評選委員會（或評審小組）與工作小組並做好名單保密', required: true });
    }
  }
  if (f.has_grant) {
    stages[0].items.push({ text: '【補助款】核對上級補助核定函、預算科目與結報死線', required: true });
    stages[lastIdx].items.push({ text: '【補助款】核算標餘款與補助結報（跨年度提前辦理預算保留）', required: true });
  }
  if (f.is_green) {
    stages[lastIdx].items.push({ text: '【綠色採購】查核環保／綠建材標章並登錄機關綠色採購網', required: true });
  }
  if (f.is_priority) {
    stages[0].items.push({ text: '【優先採購】檢核身心障礙福利機構優先採購網路資訊平台', required: false });
  }

  // 分配預設預計日期區間
  const baseStart = startDate || todayStr();
  const totalSpan = (startDate && endDate && diffDays(startDate, endDate) > 5)
    ? diffDays(startDate, endDate)
    : (tier === '小額(15萬以下)' ? 21 : tier === '未達(15-150萬)' ? 75 : 120);
  const stepDays = Math.max(3, Math.floor(totalSpan / stages.length));

  return stages.map((st, idx) => {
    const pStart = addDays(baseStart, idx * stepDays);
    const pEnd = (idx === stages.length - 1 && endDate) ? endDate : addDays(baseStart, (idx + 1) * stepDays - 1);
    return {
      stage_order: idx + 1,
      stage_name: st.name,
      plan_start: pStart,
      plan_end: pEnd,
      actual_start: '',
      actual_end: '',
      sla_deadline: '',
      blocker_note: '',
      status: idx === 0 ? '進行中' : '未開始',
      checklist_json: JSON.stringify(st.items.map((it, j) => ({
        id: `chk_${idx + 1}_${j + 1}`,
        text: it.text,
        required: !!it.required,
        done: false,
        doc_no: '',
        done_date: ''
      })))
    };
  });
}

// ============================================================================
// 3. 雲端 GAS API 同步層（Stale-While-Revalidate + 純文字防 CORS）
// ============================================================================
function setSyncUI(state, text) {
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-text');
  if (dot) dot.className = 'dot ' + (state || '');
  if (txt) txt.textContent = text;
}

async function syncFromCloud(showMsg = false) {
  if (!appConfig.gasUrl || !appConfig.token) {
    setSyncUI('', '本機體驗模式（未連線）');
    return;
  }
  setSyncUI('syncing', '同步中...');
  try {
    const url = `${appConfig.gasUrl}?action=bootstrap&token=${encodeURIComponent(appConfig.token)}&_t=${Date.now()}`;
    const res = await fetch(url);
    const json = await res.json();
    if (!json.ok) throw new Error(json.message || '同步失敗');

    appData = {
      schoolName: json.schoolName || appConfig.schoolName,
      serverTime: json.serverTime,
      portals: (json.portals && json.portals.length) ? json.portals : DEFAULT_PORTALS.slice(),
      tables: { ...emptyData().tables, ...json.tables }
    };
    persistCache();
    setSyncUI('ok', '已同步 ' + String(json.serverTime || '').slice(11, 16));
    renderHeaderAndPortals();
    renderCurrentView();
    if (showMsg) toast('✅ 已從 Google Sheets 同步最新資料');
  } catch (err) {
    setSyncUI('err', '同步失敗（使用快取）');
    if (showMsg) toast('⚠️ 連線失敗：' + err.message);
  }
}

async function pushToCloud(payload) {
  persistCache();
  if (!appConfig.gasUrl || !appConfig.token) {
    toast('💾 已暫存於瀏覽器本機（設定 GAS 後可雲端同步）');
    return { ok: true, localOnly: true };
  }
  setSyncUI('syncing', '寫入中...');
  try {
    const res = await fetch(appConfig.gasUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: appConfig.token, ...payload })
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.message || '寫入失敗');
    setSyncUI('ok', '已儲存 ' + String(json.serverTime || '').slice(11, 16));
    return json;
  } catch (err) {
    setSyncUI('err', '寫入失敗');
    toast('⚠️ 雲端寫入失敗：' + err.message);
    return { ok: false, error: err.message };
  }
}

// 本機樂觀更新輔助
function upsertLocal(table, record, pkKey) {
  const arr = appData.tables[table];
  const idx = arr.findIndex(r => r[pkKey] === record[pkKey]);
  if (idx >= 0) arr[idx] = { ...arr[idx], ...record };
  else arr.push(record);
}

function nextId(table, pkKey, prefix, pad = 4) {
  let max = 0;
  (appData.tables[table] || []).forEach(r => {
    const m = String(r[pkKey] || '').match(/(\d+)$/);
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  return `${prefix}-${String(max + 1).padStart(pad, '0')}`;
}

const PROCUREMENT_TYPE_CODE = { '工程': '01', '勞務': '02', '財物': '03' };

function isSmallProcurementTier(tier) {
  return String(tier || '').trim() === '小額(15萬以下)';
}

function formatProjectCaseNo(p) {
  if (!p) return '-';
  const pid = String(p.project_id || '').trim();
  if (isSmallProcurementTier(p.threshold_tier) && !/^XP/i.test(pid)) return '小額免編號';
  if (/^SML-/i.test(pid)) return '小額免編號';
  return pid || '-';
}

function nextProjectCaseId(fiscalYear, procurementType) {
  const fy = String(Number(fiscalYear) || (new Date().getFullYear() - 1911));
  const typeCode = PROCUREMENT_TYPE_CODE[procurementType] || '01';
  const prefix = `XP${fy}${typeCode}`;
  const re = new RegExp(`^${prefix}(\\d+)$`, 'i');
  let max = 0;
  (appData.tables.Projects || []).forEach(r => {
    if (r.is_deleted === true) return;
    const m = String(r.project_id || '').trim().match(re);
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  return `${prefix}${String(max + 1).padStart(2, '0')}`;
}

function refreshWizardProjectId(force = false) {
  const pidEl = document.getElementById('wiz-pid');
  const recalcBtn = document.getElementById('wiz-pid-recalc');
  if (!pidEl) return;
  const tier = document.getElementById('wiz-tier')?.value || '';
  if (isSmallProcurementTier(tier)) {
    pidEl.value = '';
    pidEl.placeholder = '小額採購（15萬以下）不編號';
    pidEl.disabled = true;
    if (recalcBtn) recalcBtn.disabled = true;
    return;
  }
  pidEl.disabled = false;
  pidEl.placeholder = '例：XP1150101';
  if (recalcBtn) recalcBtn.disabled = false;
  if (!force && pidEl.dataset.auto === '0' && pidEl.value.trim()) return;
  const fy = document.getElementById('wiz-fy')?.value;
  const type = document.getElementById('wiz-type')?.value || '工程';
  pidEl.value = nextProjectCaseId(fy, type);
  pidEl.dataset.auto = '1';
}

// ============================================================================
// 4. 年度固定例行事項自動復活演算法 & 跨模組紅黃燈預警引擎
// ============================================================================
function computeRoutineSchedule(r) {
  const now = new Date();
  const y = now.getFullYear();
  const rocY = y - 1911;
  const m = now.getMonth() + 1;
  const today = todayStr();
  const rule = String(r.due_rule || '').trim();
  const candidates = [];

  if (r.recurrence_type === '每年' && /^\d{2}-\d{2}$/.test(rule)) {
    candidates.push({ cycle: String(rocY), date: `${y}-${rule}` });
    candidates.push({ cycle: String(rocY + 1), date: `${y + 1}-${rule}` });
  } else if (r.recurrence_type === '每學期') {
    rule.split(',').map(s => s.trim()).forEach((md, idx) => {
      if (/^\d{2}-\d{2}$/.test(md)) {
        candidates.push({ cycle: `${rocY}-S${idx + 1}`, date: `${y}-${md}` });
        candidates.push({ cycle: `${rocY + 1}-S${idx + 1}`, date: `${y + 1}-${md}` });
      }
    });
  } else if (r.recurrence_type === '每季') {
    const dayNum = parseInt((rule.match(/\d+$/) || ['15'])[0], 10);
    const dd = String(Math.min(28, Math.max(1, dayNum))).padStart(2, '0');
    const isNext = rule.startsWith('Q-NEXT');
    const qMonths = isNext ? [1, 4, 7, 10] : [3, 6, 9, 12];
    qMonths.forEach((qm, idx) => {
      const qLabel = isNext ? (idx === 0 ? `${rocY - 1}-Q4` : `${rocY}-Q${idx}`) : `${rocY}-Q${idx + 1}`;
      candidates.push({ cycle: qLabel, date: `${y}-${String(qm).padStart(2, '0')}-${dd}` });
    });
    candidates.push({ cycle: isNext ? `${rocY}-Q4` : `${rocY + 1}-Q1`, date: `${y + 1}-${String(qMonths[0]).padStart(2, '0')}-${dd}` });
  } else if (r.recurrence_type === '每月' || r.recurrence_type === '每雙月') {
    const dayNum = parseInt((rule.match(/\d+$/) || ['10'])[0], 10);
    const dd = String(Math.min(28, Math.max(1, dayNum))).padStart(2, '0');
    for (let offset = -1; offset <= 2; offset++) {
      const dt = new Date(y, m - 1 + offset, 1);
      const yy = dt.getFullYear(), mm = dt.getMonth() + 1;
      if (r.recurrence_type === '每雙月' && mm % 2 !== 0) continue;
      candidates.push({ cycle: `${yy - 1911}-${String(mm).padStart(2, '0')}`, date: `${yy}-${String(mm).padStart(2, '0')}-${dd}` });
    }
  }

  candidates.sort((a, b) => a.date.localeCompare(b.date));
  const lead = Number(r.lead_days) || 14;
  for (const c of candidates) {
    if (c.cycle === r.last_done_cycle) continue;
    const diff = diffDays(today, c.date);
    if (diff >= -45) {
      return { cycle: c.cycle, dueDate: c.date, diffDays: diff, isVisible: diff <= lead };
    }
  }
  const fallback = candidates[candidates.length - 1] || { cycle: String(rocY), date: today };
  return { cycle: fallback.cycle, dueDate: fallback.date, diffDays: diffDays(today, fallback.date), isVisible: false };
}

function buildAllAlerts() {
  const today = todayStr();
  const alerts = [];
  const prjMap = {};
  (appData.tables.Projects || []).forEach(p => { prjMap[p.project_id] = p; });

  // 1. 標案補助死線 & 保固到期
  (appData.tables.Projects || []).forEach(p => {
    if (p.status === '已結案' || p.status === '廢標撤案') return;
    if (p.grant_deadline) {
      const d = diffDays(today, p.grant_deadline);
      if (d <= 14) {
        alerts.push({
          level: 'red', badge: '補助死線', title: p.project_name || p.project_id,
          detail: `補助核銷期限 ${p.grant_deadline}（${d < 0 ? '逾期 ' + Math.abs(d) + ' 天' : '剩 ' + d + ' 天'}）`,
          sortKey: d, action: () => openProjectDetail(p.project_id)
        });
      }
    }
    if (p.status === '保固追蹤中' && p.warranty_end_date) {
      const d = diffDays(today, p.warranty_end_date);
      if (d <= 30) {
        alerts.push({
          level: d < 0 ? 'red' : 'amber', badge: '保固到期', title: p.project_name || p.project_id,
          detail: `保固至 ${p.warranty_end_date}（${d < 0 ? '已到期' : '剩 ' + d + ' 天，請排會勘'}）`,
          sortKey: d, action: () => openProjectDetail(p.project_id)
        });
      }
    }
  });

  // 2. 階段法定死線 & 預計結束逾期
  (appData.tables.Project_Tasks || []).forEach(t => {
    const p = prjMap[t.project_id];
    if (!p || p.status === '已結案' || p.status === '廢標撤案' || t.status === '已完成') return;
    if (t.sla_deadline) {
      const d = diffDays(today, t.sla_deadline);
      if (d <= 14) {
        alerts.push({
          level: d < 0 ? 'red' : 'amber', badge: '法定死線', title: `${p.project_name}｜${t.stage_name}`,
          detail: `法定期限 ${t.sla_deadline}（${d < 0 ? '逾期 ' + Math.abs(d) + ' 天' : '剩 ' + d + ' 天'}）`,
          sortKey: d, action: () => openProjectDetail(p.project_id)
        });
      }
    } else if (t.status === '進行中' && t.plan_end) {
      const d = diffDays(today, t.plan_end);
      if (d < 0) {
        alerts.push({
          level: 'amber', badge: '進度落後', title: `${p.project_name}｜${t.stage_name}`,
          detail: `預計完成 ${t.plan_end}（落後 ${Math.abs(d)} 天）`,
          sortKey: d + 5, action: () => openProjectDetail(p.project_id)
        });
      }
    }
  });

  // 3. 臨時交辦 Memo 到期／指定提醒
  (appData.tables.Quick_Memos || []).forEach(m => {
    if (m.is_done) return;
    if (m.due_date) {
      const d = diffDays(today, m.due_date);
      if (d <= 3) {
        alerts.push({
          level: d <= 0 ? 'red' : 'amber', badge: m.source_tag || '交辦到期', title: m.content,
          detail: `交辦期限 ${m.due_date}（${d < 0 ? '逾期 ' + Math.abs(d) + ' 天' : d === 0 ? '今天到期' : '剩 ' + d + ' 天'}）`,
          sortKey: d, action: () => { switchTab('dashboard'); }
        });
      }
    } else if (m.remind_date && diffDays(today, m.remind_date) <= 0) {
      alerts.push({
        level: m.priority === '緊急' ? 'red' : 'amber', badge: 'Memo提醒', title: m.content,
        detail: `指定提醒日 ${m.remind_date}（${m.source_tag || '自訂備忘'}）`,
        sortKey: 0, action: () => { switchTab('dashboard'); }
      });
    }
  });

  // 4. 固定例行業務逾期或 7 天內到期
  (appData.tables.Annual_Routines || []).filter(r => r.is_active !== false).forEach(r => {
    const sch = computeRoutineSchedule(r);
    if (sch.diffDays <= 7) {
      alerts.push({
        level: sch.diffDays < 0 ? 'red' : 'amber', badge: '例行業務', title: r.title,
        detail: `期別 ${sch.cycle}｜期限 ${sch.dueDate}（${sch.diffDays < 0 ? '逾期 ' + Math.abs(sch.diffDays) + ' 天' : '剩 ' + sch.diffDays + ' 天'}）`,
        sortKey: sch.diffDays, action: () => switchTab('routines')
      });
    }
  });

  // 5. 預留第二期：太陽能與水電紅黃燈自動彙整
  (appData.tables.Solar_Contracts || []).filter(s => s.status !== '已期滿').forEach(s => {
    [ ['保險續保', s.insurance_expiry], ['履約保證函', s.deposit_expiry] ].forEach(([lbl, dt]) => {
      if (!dt) return;
      const d = diffDays(today, dt);
      if (d <= 30) {
        alerts.push({ level: d < 0 ? 'red' : 'amber', badge: '太陽能' + lbl, title: s.building_name, detail: `到期日 ${dt}（剩 ${d} 天）`, sortKey: d });
      }
    });
  });
  (appData.tables.Utilities_Bills || []).forEach(b => {
    if (b.alert_flags && b.alert_flags !== '正常' && b.paid_status !== '已撥款') {
      alerts.push({ level: 'red', badge: '水電異常', title: `錶號 ${b.meter_id} (${b.billing_ym})`, detail: b.alert_flags, sortKey: -5 });
    }
  });

  const rank = { red: 0, amber: 1, blue: 2 };
  alerts.sort((a, b) => (rank[a.level] - rank[b.level]) || (a.sortKey - b.sortKey));
  return alerts;
}

function switchTab(tab) {
  currentTab = tab;
  if (tab !== 'projects') selectedProjectId = null;
  document.querySelectorAll('.nav-tab').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tab));
  renderCurrentView();
}

function renderCurrentView() {
  const el = document.getElementById('main-view');
  if (currentTab === 'dashboard') el.innerHTML = renderDashboardHTML();
  else if (currentTab === 'projects') el.innerHTML = selectedProjectId ? renderProjectDetailHTML(selectedProjectId) : renderProjectsListHTML();
  else if (currentTab === 'annual-gantt') el.innerHTML = renderAnnualGanttHTML();
  else if (currentTab === 'templates') el.innerHTML = renderTemplatesHTML();
  else if (currentTab === 'routines') el.innerHTML = renderRoutinesHTML();

}

// ============================================================================
// 6. 向量 SVG 甘特圖繪製與 A4 橫式 PDF 輸出
// ============================================================================
function buildSingleGanttSVG(p, tasks) {
  const dates = [];
  tasks.forEach(t => {
    [t.plan_start, t.plan_end, t.actual_start, t.actual_end, t.sla_deadline].forEach(d => { if (d) dates.push(d); });
  });
  if (p.orig_end_date) dates.push(p.orig_end_date);
  if (!dates.length) return '<div class="empty-state">尚未設定各階段日期，請點擊「📅 期程／死線」設定起迄日。</div>';

  dates.sort();
  const minDate = addDays(dates[0], -5);
  const maxDate = addDays(dates[dates.length - 1], 10);
  const totalDays = Math.max(15, diffDays(minDate, maxDate));

  const W = 1040, leftW = 290, chartW = W - leftW - 20;
  const rowH = 38, headH = 34;
  const H = headH + tasks.length * rowH + 16;
  const xOf = ymd => leftW + (diffDays(minDate, ymd) / totalDays) * chartW;

  const tickStep = Math.max(5, Math.ceil(totalDays / 10));
  let gridSvg = '';
  for (let d = 0; d <= totalDays; d += tickStep) {
    const dt = addDays(minDate, d);
    const x = leftW + (d / totalDays) * chartW;
    gridSvg += `<line x1="${x}" y1="${headH}" x2="${x}" y2="${H}" stroke="#e2e8f0" stroke-width="1"/>`;
    gridSvg += `<text x="${x}" y="22" font-size="10.5" fill="#64748b" text-anchor="middle">${dt.slice(5)}</text>`;
  }

  const today = todayStr();
  let markersSvg = '';
  if (today >= minDate && today <= maxDate) {
    const tx = xOf(today);
    markersSvg += `<line x1="${tx}" y1="${headH}" x2="${tx}" y2="${H}" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>`;
    markersSvg += `<text x="${tx}" y="11" font-size="9.5" fill="#dc2626" font-weight="700" text-anchor="middle">今日</text>`;
  }
  if (p.orig_end_date && p.orig_end_date >= minDate && p.orig_end_date <= maxDate) {
    const ox = xOf(p.orig_end_date);
    markersSvg += `<line x1="${ox}" y1="${headH}" x2="${ox}" y2="${H}" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,3"/>`;
    markersSvg += `<text x="${ox}" y="${H - 3}" font-size="9.5" fill="#334155" font-weight="700" text-anchor="middle">原訂完工</text>`;
  }

  let rowsSvg = '';
  tasks.forEach((t, idx) => {
    const y = headH + idx * rowH;
    const items = parseJSON(t.checklist_json, []);
    const done = items.filter(i => i.done).length;
    rowsSvg += `<rect x="0" y="${y}" width="${W}" height="${rowH}" fill="${idx % 2 ? '#f8fafc' : '#ffffff'}"/>`;
    rowsSvg += `<line x1="0" y1="${y + rowH}" x2="${W}" y2="${y + rowH}" stroke="#f1f5f9"/>`;
    rowsSvg += `<text x="10" y="${y + 16}" font-size="12" font-weight="700" fill="#0f172a">${t.stage_order}. ${escSvg(t.stage_name)}</text>`;
    rowsSvg += `<text x="10" y="${y + 31}" font-size="10.5" fill="#64748b">檢核 ${done}/${items.length} ｜ ${escSvg(t.status)}</text>`;

    if (t.plan_start && t.plan_end) {
      const x1 = xOf(t.plan_start), x2 = Math.max(x1 + 6, xOf(t.plan_end));
      rowsSvg += `<rect x="${x1}" y="${y + 7}" width="${x2 - x1}" height="10" rx="3" fill="#cbd5e1"/>`;
    }
    if (t.actual_start) {
      const aEnd = t.actual_end || (today > t.actual_start ? today : t.actual_start);
      const ax1 = xOf(t.actual_start), ax2 = Math.max(ax1 + 6, xOf(aEnd));
      const color = t.status === '已完成' ? '#059669' : t.status === '缺件卡關' ? '#dc2626' : '#1d4ed8';
      rowsSvg += `<rect x="${ax1}" y="${y + 20}" width="${ax2 - ax1}" height="10" rx="3" fill="${color}"/>`;
    }
    if (t.sla_deadline && t.sla_deadline >= minDate && t.sla_deadline <= maxDate) {
      const sx = xOf(t.sla_deadline);
      rowsSvg += `<polygon points="${sx},${y+8} ${sx+5},${y+13} ${sx},${y+18} ${sx-5},${y+13}" fill="#dc2626"/>`;
    }
  });

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;font-family:'Microsoft JhengHei',sans-serif">
    <rect x="0" y="0" width="${W}" height="${headH}" fill="#f1f5f9"/>
    <text x="10" y="22" font-size="12" font-weight="700" fill="#334155">階段名稱與檢核進度</text>
    ${rowsSvg}${gridSvg}${markersSvg}
  </svg>`;
}

function buildAnnualGanttSVG(rocYear, projects, monthLoad) {
  const adYear = Number(rocYear) + 1911;
  const yearStart = `${adYear}-01-01`;
  const yearEnd = `${adYear}-12-31`;
  const totalDays = diffDays(yearStart, yearEnd) + 1;

  const W = 1040, leftW = 270, chartW = W - leftW - 12;
  const rowH = 34, headH = 52;
  const H = headH + Math.max(1, projects.length) * rowH + 10;
  const xOf = ymd => {
    const clamped = ymd < yearStart ? yearStart : (ymd > yearEnd ? yearEnd : ymd);
    return leftW + (diffDays(yearStart, clamped) / totalDays) * chartW;
  };

  let headerSvg = `<rect x="0" y="0" width="${W}" height="${headH}" fill="#f1f5f9"/>`;
  headerSvg += `<text x="10" y="22" font-size="12" font-weight="700" fill="#334155">標案名稱（${rocYear}年度）</text>`;
  headerSvg += `<text x="10" y="42" font-size="10.5" fill="#64748b">各月開標／驗收負荷件數</text>`;

  let gridSvg = '';
  for (let m = 0; m < 12; m++) {
    const mStart = `${adYear}-${String(m + 1).padStart(2, '0')}-01`;
    const mNext = m === 11 ? yearEnd : `${adYear}-${String(m + 2).padStart(2, '0')}-01`;
    const x1 = xOf(mStart), x2 = xOf(mNext);
    const load = monthLoad[m];
    headerSvg += `<rect x="${x1}" y="28" width="${x2 - x1}" height="22" fill="${load >= 3 ? '#fef3c7' : '#ffffff'}" stroke="#e2e8f0"/>`;
    headerSvg += `<text x="${(x1 + x2) / 2}" y="19" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">${m + 1}月</text>`;
    headerSvg += `<text x="${(x1 + x2) / 2}" y="43" font-size="10.5" font-weight="700" fill="${load >= 3 ? '#b45309' : '#64748b'}" text-anchor="middle">${load}案</text>`;
    gridSvg += `<line x1="${x1}" y1="${headH}" x2="${x1}" y2="${H}" stroke="#e2e8f0"/>`;
  }

  let rowsSvg = '';
  if (!projects.length) {
    rowsSvg = `<text x="${W / 2}" y="${headH + 22}" font-size="13" fill="#64748b" text-anchor="middle">民國 ${rocYear} 年度尚無標案資料</text>`;
  } else {
    projects.forEach((p, idx) => {
      const y = headH + idx * rowH;
      rowsSvg += `<rect x="0" y="${y}" width="${W}" height="${rowH}" fill="${idx % 2 ? '#f8fafc' : '#ffffff'}"/>`;
      rowsSvg += `<text x="10" y="${y + 21}" font-size="11.5" font-weight="700" fill="#1d4ed8" style="cursor:pointer" onclick="openProjectDetail('${esc(p.project_id)}')">${escSvg(String(p.project_name || '').slice(0, 18))}</text>`;
      getProjectTasks(p.project_id).forEach(t => {
        if (!t.plan_start || !t.plan_end) return;
        if (t.plan_end < yearStart || t.plan_start > yearEnd) return;
        const x1 = xOf(t.plan_start), x2 = Math.max(x1 + 4, xOf(t.plan_end));
        const sn = String(t.stage_name || '');
        const col = sn.includes('驗收') || sn.includes('核銷') ? '#059669'
          : (sn.includes('施工') || sn.includes('履約') ? '#2563eb' : '#f59e0b');
        rowsSvg += `<rect x="${x1}" y="${y + 9}" width="${x2 - x1}" height="16" rx="3" fill="${col}" opacity="0.88"><title>${escSvg(sn)} (${t.plan_start}~${t.plan_end})</title></rect>`;
      });
    });
  }

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;font-family:'Microsoft JhengHei',sans-serif">${headerSvg}${rowsSvg}${gridSvg}</svg>`;
}

  const projects = (appData.tables.Projects || []).filter(p => Number(p.fiscal_year) === Number(annualGanttYear) && p.status !== '廢標撤案');
  const adYear = Number(annualGanttYear) + 1911;

  projects.forEach(p => getProjectTasks(p.project_id).forEach(t => {
    const sn = String(t.stage_name || '');
    if (sn.includes('開標') || sn.includes('驗收')) {

async function submitNewProject() {
  const name = document.getElementById('wiz-name').value.trim();
  if (!name) return toast('請填寫標案名稱');
  const fy = Number(document.getElementById('wiz-fy').value) || (new Date().getFullYear() - 1911);
  const tid = document.getElementById('wiz-tpl').value;
  const type = document.getElementById('wiz-type').value;
  const tier = document.getElementById('wiz-tier').value;
  const awardMethod = document.getElementById('wiz-award').value;
  const startDate = document.getElementById('wiz-start').value || todayStr();
  const endDate = document.getElementById('wiz-end').value;
  const engCat = type === '工程' ? document.getElementById('wiz-eng-cat').value : '不適用';
  const flags = {
    has_grant: document.getElementById('flg-grant').checked,
    is_green: document.getElementById('flg-green').checked,
    is_priority: document.getElementById('flg-prio').checked,
    use_committee: document.getElementById('flg-comm').checked
  };

  let projectId;
  if (isSmallProcurementTier(tier)) {
    projectId = nextId('Projects', 'project_id', `SML-${fy}`, 3);
  } else {
    const rawPid = (document.getElementById('wiz-pid')?.value || '').trim().toUpperCase();
    projectId = rawPid || nextProjectCaseId(fy, type);
    if ((appData.tables.Projects || []).some(p => String(p.project_id || '').trim().toUpperCase() === projectId)) {
      return toast(`❌ 標案案號 ${projectId} 已存在，請修改案號`);
    }
  }
  const projectRec = {
    project_id: projectId, fiscal_year: fy, project_name: name,
    procurement_type: type, threshold_tier: tier, award_method: awardMethod,
    supervision_mode: type === '工程' ? '委外監造' : '不適用',
    engineering_category: engCat,
    funding_source: document.getElementById('wiz-funding').value,
    grant_deadline: document.getElementById('wiz-grant-dl').value,
    flags_json: JSON.stringify(flags),
    budget_amount: Number(document.getElementById('wiz-budget').value) || 0,
    award_amount: '', vendor_name: '', vendor_contact: '', designer_contact: '', supervisor_contact: '',
    duration_type: '日曆天', duration_days: '', start_date: tid ? '' : startDate, orig_end_date: endDate,
    actual_completion_date: '', acceptance_date: '', retention_rate: 0.05, warranty_years: 1, warranty_end_date: '',
    status: '籌備中', source_template_id: tid, drive_folder_url: '', updated_at: nowStr(), is_deleted: false
  };

  let stageDefs = [];
  if (tid) {
    const tpl = (appData.tables.Templates || []).find(x => x.template_id === tid);
    const offsets = parseJSON(tpl?.stages_offset_json, []);
    stageDefs = offsets.map((st, idx) => ({
      stage_order: st.order || idx + 1,
      stage_name: st.name,
      plan_start: shiftWeekend(addDays(startDate, Number(st.offset_start || 0))),
      plan_end: shiftWeekend(addDays(startDate, Number(st.offset_end || 0))),
      actual_start: '', actual_end: '', sla_deadline: '', blocker_note: '',
      status: idx === 0 ? '進行中' : '未開始',
      checklist_json: JSON.stringify((st.checklist || []).map((c, j) => ({
        id: c.id || `chk_${idx+1}_${j+1}`, text: c.text, required: !!c.required, done: false, doc_no: '', done_date: ''
      })))
    }));
  } else {
    stageDefs = buildStandardStages({ tier, type, awardMethod, flags, startDate, endDate, engCat });
  }

  let seqBase = 0;
  (appData.tables.Project_Tasks || []).forEach(r => {
    const m = String(r.task_id || '').match(/(\d+)$/);
    if (m) seqBase = Math.max(seqBase, parseInt(m[1], 10));
  });
  const taskRecs = stageDefs.map((st, i) => ({
    task_id: `TSK-${String(seqBase + i + 1).padStart(4, '0')}`,
    project_id: projectId, ...st, updated_at: nowStr(), is_deleted: false
  }));

  upsertLocal('Projects', projectRec, 'project_id');
  taskRecs.forEach(tr => upsertLocal('Project_Tasks', tr, 'task_id'));

  const batchItems = [
    { table: 'Projects', records: [projectRec] },
    { table: 'Project_Tasks', records: taskRecs }
  ];

  const srcMemoId = document.getElementById('wiz-source-memo').value;
  if (srcMemoId) {
    const memo = (appData.tables.Quick_Memos || []).find(m => m.memo_id === srcMemoId);
    if (memo) {
      memo.converted_ref = projectId;
      batchItems.push({ table: 'Quick_Memos', records: [memo] });
    }
  }

  closeModal();
  openProjectDetail(projectId);
  await pushToCloud({ action: 'batchUpsert', items: batchItems });
  toast(`✅ 已建立${isSmallProcurementTier(tier) ? '小額採購案（免編號）' : '標案 ' + projectId} 並展開 ${taskRecs.length} 個標準階段`);
}

// Checklist 與階段操作
async function toggleCheckItem(taskId, idx, checked) {
  const t = (appData.tables.Project_Tasks || []).find(x => x.task_id === taskId);
  if (!t) return;
  const items = parseJSON(t.checklist_json, []);
  if (!items[idx]) return;
  items[idx].done = checked;
  if (checked && !items[idx].done_date) items[idx].done_date = todayStr();
  t.checklist_json = JSON.stringify(items);
  if (checked && t.status === '未開始') {
    t.status = '進行中';
    if (!t.actual_start) t.actual_start = todayStr();
  }
  if (items.length && items.every(i => i.done)) {
    t.status = '已完成';
    if (!t.actual_end) t.actual_end = todayStr();
  }
  renderCurrentView();

async function saveAsTemplate(projectId) {
  const p = (appData.tables.Projects || []).find(x => x.project_id === projectId);
  const name = document.getElementById('st-name').value.trim();
  if (!p || !name) return toast('請填寫模板名稱');
  const anchorDt = document.getElementById('st-anchor-dt').value || todayStr();
  const tasks = getProjectTasks(projectId);

  const offsets = tasks.map(t => ({
    order: t.stage_order,
    name: t.stage_name,
    offset_start: t.plan_start ? diffDays(anchorDt, t.plan_start) : 0,
    offset_end: t.plan_end ? diffDays(anchorDt, t.plan_end) : 7,
    checklist: parseJSON(t.checklist_json, []).map(c => ({ id: c.id, text: c.text, required: !!c.required }))
  }));

  const tpl = {
    template_id: nextId('Templates', 'template_id', 'TPL', 3),
    template_name: name,
    procurement_type: p.procurement_type,
    threshold_tier: p.threshold_tier,
    award_method: p.award_method,
    anchor_label: document.getElementById('st-anchor-lbl').value.trim() || '基準日',
    stages_offset_json: JSON.stringify(offsets),
    default_materials_json: '[]',
    lessons_learned: document.getElementById('st-lessons').value.trim(),
    updated_at: nowStr(), is_deleted: false
  };
  upsertLocal('Templates', tpl, 'template_id');
  closeModal();
  await pushToCloud({ action: 'upsert', table: 'Templates', record: tpl });
  toast(`✅ 已存入模板庫：${tpl.template_id}`);
}

// ============================================================================
// 8. 通用輔助函式
// ============================================================================
function getProjectTasks(projectId) {
  return (appData.tables.Project_Tasks || [])
    .filter(t => t.project_id === projectId)
    .sort((a, b) => Number(a.stage_order) - Number(b.stage_order));
}

function calcProjectProgress(projectId) {
  const tasks = getProjectTasks(projectId);
  let total = 0, done = 0, currentStage = '尚未開始';
  for (const t of tasks) {
    const items = parseJSON(t.checklist_json, []);
    total += items.length;
    done += items.filter(i => i.done).length;
    if (currentStage === '尚未開始' && t.status !== '已完成') currentStage = t.stage_name;
  }
  if (tasks.length && tasks.every(t => t.status === '已完成')) currentStage = '全部階段已完成';
  return { totalChecks: total, doneChecks: done, pct: total ? Math.round((done / total) * 100) : 0, currentStage };
}

function statusTagCls(s) {
  if (s === '已結案') return 'tag-green';
  if (s === '履約中' || s === '招標中') return 'tag-blue';
  if (s === '驗收中' || s === '保固追蹤中') return 'tag-amber';
  return 'tag-gray';
}

function openModal(title, bodyHtml, footerHtml) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-footer').innerHTML = footerHtml;
  document.getElementById('modal-backdrop').classList.add('open');
}
function closeModal() { document.getElementById('modal-backdrop').classList.remove('open'); }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

function parseJSON(val, fallback) {
  if (Array.isArray(val) || (val && typeof val === 'object')) return val;
  try { return JSON.parse(val); } catch { return fallback; }
}
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escSvg(s) { return esc(s); }
function fmtMoney(n) { return (n === '' || n === null || n === undefined) ? '-' : Number(n).toLocaleString('zh-TW') + ' 元'; }
function fmtDate(dt) { return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; }
function todayStr() { return fmtDate(new Date()); }
function nowStr() {
  const d = new Date();
  return `${fmtDate(d)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
}
function diffDays(a, b) {
  return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
}
function addDays(ymd, days) {
  const d = new Date(ymd + 'T00:00:00');
  d.setDate(d.getDate() + Number(days));
  return fmtDate(d);
}
function shiftWeekend(ymd) {
  const d = new Date(ymd + 'T00:00:00');
  if (d.getDay() === 6) d.setDate(d.getDate() + 2);
  else if (d.getDay() === 0) d.setDate(d.getDate() + 1);
  return fmtDate(d);
}
